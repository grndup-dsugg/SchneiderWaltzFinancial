<style>
  :root{
    --navy-900:#0F2438;
    --navy-800:#152C44;
    --navy-700:#1E3F60;
    --paper:#F6F4EE;
    --brass:#D9A34A;
    --brass-dark:#C08A2E;
    --glow:#3FD6C4;

    --font-display:'Space Grotesk', -apple-system, Segoe UI, sans-serif;
    --font-body:'Inter', -apple-system, Segoe UI, sans-serif;
    --font-mono:'JetBrains Mono', 'Courier New', monospace;
    --radius:20px;
    --radius-pill:999px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; height:100%;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  body{
    margin:0;
    min-height:100dvh;
    height:100%;
    position:relative;
    font-family:var(--font-body);
    color:var(--paper);
    background:
      radial-gradient(ellipse 900px 600px at 12% -10%, rgba(63,214,196,.16), transparent 60%),
      radial-gradient(ellipse 900px 700px at 88% 110%, rgba(217,163,74,.18), transparent 60%),
      linear-gradient(160deg, var(--navy-900) 0%, var(--navy-800) 55%, var(--navy-700) 100%);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ambient drifting orbs — quiet, slow motion behind the content */
  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    opacity:.35;
    pointer-events:none;
    z-index:0;
  }
  .orb-1{
    width:420px; height:420px;
    top:-120px; left:-100px;
    background:radial-gradient(circle, var(--glow), transparent 70%);
    animation:drift1 22s ease-in-out infinite;
  }
  .orb-2{
    width:480px; height:480px;
    bottom:-160px; right:-140px;
    background:radial-gradient(circle, var(--brass), transparent 70%);
    animation:drift2 26s ease-in-out infinite;
  }
  @keyframes drift1{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(40px,50px) scale(1.1);}
  }
  @keyframes drift2{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-30px,-40px) scale(1.08);}
  }

  a{color:inherit;}

  .skip-link{
    position:absolute; left:-999px; top:0;
    background:var(--brass); color:var(--navy-900);
    padding:.8em 1.2em; z-index:1000;
    font-family:var(--font-body); font-weight:600;
    border-radius:0 0 12px 0;
  }
  .skip-link:focus{left:0; top:0;}

  a:focus-visible, button:focus-visible{
    outline:3px solid var(--glow);
    outline-offset:3px;
    border-radius:8px;
  }

  main{
    position:relative;
    z-index:1;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:64px 24px 32px;
  }

  .hero{
    width:100%;
    max-width:640px;
    text-align:center;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.09);
    border-radius:32px;
    padding:56px 44px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 30px 80px -30px rgba(0,0,0,.55);
  }

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  .anim{
    opacity:0;
    animation:fadeUp .7s cubic-bezier(.2,.7,.3,1) forwards;
  }
  .brand{animation-delay:.05s;}
  .eyebrow{animation-delay:.15s;}
  .lede{animation-delay:.25s;}
  .cta-row{animation-delay:.35s;}
  .fine-print{animation-delay:.45s;}

  .brand{
    display:inline-flex;
    align-items:center;
    gap:.7em;
    text-decoration:none;
    margin-bottom:2em;
  }
  .brand-mark{
    width:38px; height:38px; flex:none;
    animation:float 5s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-5px) rotate(3deg);}
  }
  .brand-text{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.2rem;
    color:var(--paper);
    text-align:left;
    line-height:1.15;
    letter-spacing:-.01em;
  }
  .brand-text small{
    display:block;
    font-family:var(--font-mono);
    font-size:.6rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--brass);
    font-weight:600;
  }

  .eyebrow{
    font-family:var(--font-mono);
    text-transform:uppercase;
    letter-spacing:.14em;
    font-size:.72rem;
    font-weight:600;
    color:var(--glow);
    display:inline-flex;
    align-items:center;
    gap:.7em;
    margin-bottom:1.3em;
    padding:.5em 1em;
    border:1px solid rgba(63,214,196,.35);
    border-radius:var(--radius-pill);
    background:rgba(63,214,196,.08);
  }

  .lede{
    color:rgba(246,244,238,.82);
    font-size:1.1rem;
    max-width:44ch;
    margin:0 auto 2.4em;
  }

  .cta-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:16px;
    margin-bottom:1.6em;
  }

  .btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:.5em;
    padding:1.05em 2.1em;
    font-family:var(--font-body);
    font-weight:600;
    font-size:1rem;
    text-decoration:none;
    border-radius:var(--radius-pill);
    border:1px solid transparent;
    cursor:pointer;
    transition:transform .25s cubic-bezier(.2,.8,.3,1), box-shadow .25s ease, background .25s ease, color .25s ease, border-color .25s ease;
    min-width:240px;
    width:300px;
    white-space:nowrap;
    overflow:hidden;
  }
  .btn:active{transform:translateY(1px) scale(.98);}

  .btn-primary{
    background:linear-gradient(135deg, var(--brass) 0%, var(--brass-dark) 100%);
    color:var(--navy-900);
    box-shadow:0 8px 24px -8px rgba(217,163,74,.55);
  }
  .btn-primary:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 32px -10px rgba(217,163,74,.65);
  }

  .btn-outline{
    background:rgba(255,255,255,.03);
    color:var(--paper);
    border-color:rgba(246,244,238,.3);
  }
  .btn-outline:hover{
    transform:translateY(-3px);
    background:rgba(246,244,238,.1);
    border-color:rgba(246,244,238,.6);
    box-shadow:0 16px 32px -14px rgba(0,0,0,.5);
  }

  /* subtle shine sweep on hover, modern micro-interaction */
  .btn::after{
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent);
    transform:skewX(-20deg);
    transition:left .6s ease;
  }
  .btn:hover::after{left:130%;}

  .fine-print{
    font-family:var(--font-body);
    font-size:.85rem;
    color:rgba(246,244,238,.5);
  }

  footer{
    position:relative;
    z-index:1;
    text-align:center;
    padding:8px 24px 32px;
    font-size:.78rem;
    color:rgba(246,244,238,.45);
  }
  footer a{text-decoration:underline; text-decoration-color:var(--brass);}

  @media (max-width: 560px){
    .hero{padding:44px 28px; border-radius:24px;}
    .btn{min-width:0; width:100%; white-space:normal;}
    .cta-row{flex-direction:column;}
  }
</style>
</head>
<body>

<div class="orb orb-1" aria-hidden="true"></div>
<div class="orb orb-2" aria-hidden="true"></div>

<a href="#main" class="skip-link">Skip to main content</a>

<main id="main">
  <div class="hero">
    <span class="brand anim" aria-hidden="true">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="40" height="40" rx="12" fill="#D9A34A"/>
        <path d="M8 27L16 17L22 22L32 10" stroke="#0F2438" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M25 10H32V17" stroke="#0F2438" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-text">Schneider Waltz<small>Financial</small></span>
    </span>

    <p class="lede anim">Local financial guidance for Evansville-area residents. Choose where you'd like to start.</p>

    <div class="cta-row anim">
      <a href="https://sfinc.com" class="btn btn-outline" target="_blank" rel="noopener">Visit Schneider Financial</a>
      <a href="https://www.wealthtrendsadvisors.com/" class="btn btn-outline" target="_blank" rel="noopener">Visit Wealthtrends Advisors</a>
    </div>
  </div>
</main>

<footer>
  <p>© <span id="year"></span> Schneider Waltz Financial · Evansville, IN</p>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
